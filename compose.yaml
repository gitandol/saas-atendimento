services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.desenvolvimento
      SECRET_KEY: ${SECRET_KEY:-insegura-apenas-para-desenvolvimento}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A config worker --loglevel=INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.desenvolvimento
      SECRET_KEY: ${SECRET_KEY:-insegura-apenas-para-desenvolvimento}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
