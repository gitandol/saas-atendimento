services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"]
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.desenvolvimento}
      SECRET_KEY: ${SECRET_KEY:-insegura-apenas-para-desenvolvimento}
      IA_CHAVE_CRIPTOGRAFIA: ${IA_CHAVE_CRIPTOGRAFIA:-insegura-apenas-para-desenvolvimento}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_INTERNAL_URL: ${EVOLUTION_INTERNAL_URL:-http://evolution:8080}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-http://web:8000}
      WHATSAPP_HOSTS_INTERNOS_PERMITIDOS: ${WHATSAPP_HOSTS_INTERNOS_PERMITIDOS:-evolution}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; requisicao = urllib.request.Request('http://localhost:8000/api/v1/saude', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(requisicao)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A config worker --loglevel=INFO
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.desenvolvimento}
      SECRET_KEY: ${SECRET_KEY:-insegura-apenas-para-desenvolvimento}
      IA_CHAVE_CRIPTOGRAFIA: ${IA_CHAVE_CRIPTOGRAFIA:-insegura-apenas-para-desenvolvimento}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      EVOLUTION_INTERNAL_URL: ${EVOLUTION_INTERNAL_URL:-http://evolution:8080}
      EVOLUTION_WEBHOOK_BASE_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-http://web:8000}
      WHATSAPP_HOSTS_INTERNOS_PERMITIDOS: ${WHATSAPP_HOSTS_INTERNOS_PERMITIDOS:-evolution}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atendimento}
      POSTGRES_USER: ${POSTGRES_USER:-atendimento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendimento-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution-local}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_INTERNAL_URL:-http://evolution:8080}
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN}
      LOG_COLOR: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution-local-api-key}
      DATABASE_PROVIDER: postgresql
      # Credenciais interpoladas devem usar o alfabeto URL-safe documentado no .env.example.
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD:-evolution-local}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: saas_atendimento
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Atendimento SaaS
      CONFIG_SESSION_PHONE_NAME: Chrome
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  evolution_postgres_data:
