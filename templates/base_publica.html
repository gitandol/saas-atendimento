{% load static %}
<!doctype html>
<html lang="pt-BR" data-tema="azul">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Atendimento{% endblock %}</title>
    {% include "componentes/tema_inicial.html" %}
    <link rel="stylesheet" href="{% static 'dist/css/aplicacao.css' %}">
    <script src="{% static 'src/js/tema.js' %}" defer></script>
  </head>
  <body class="pagina-publica" data-autenticado="false">
    <header class="cabecalho-publico">
      <nav class="navegacao-publica" aria-label="Principal">
        <a class="marca marca-publica" href="/">
          <span class="marca-simbolo" aria-hidden="true">A</span>
          <span>Atendimento</span>
        </a>
        <div class="acoes-publicas">
          {% include "componentes/seletor_tema.html" %}
          <a class="link-ajuda-publico" href="#ajuda">Ajuda</a>
        </div>
      </nav>
    </header>
    <main id="conteudo-principal" class="conteudo-publico">
      {% block conteudo %}{% endblock %}
    </main>
  </body>
</html>
