<aside id="sidebar" class="sidebar" aria-label="Navega&ccedil;&atilde;o principal">
  <div class="marca">
    <span class="marca-simbolo" aria-hidden="true">A</span>
    <span class="marca-identidade sidebar-rotulo">
      <strong>Atendimento</strong>
      <span class="marca-descricao sidebar-rotulo">Central de conversas</span>
    </span>
  </div>
  <nav aria-label="Principal">
    <a class="item-navegacao{% if request.path == "/perfil/" %} item-navegacao-ativo{% endif %}" href="/perfil/"{% if request.path == "/perfil/" %} aria-current="page"{% endif %}>
      <span aria-hidden="true">&#9679;</span>
      <span class="sidebar-rotulo">Perfil</span>
    </a>
    <a class="item-navegacao{% if "/empresa/" in request.path %} item-navegacao-ativo{% endif %}" href="/empresa/configuracao/"{% if "/empresa/" in request.path %} aria-current="page"{% endif %}>
      <span aria-hidden="true">&#9881;</span>
      <span class="sidebar-rotulo">Empresa</span>
    </a>
    <details class="grupo-navegacao-ia"{% if "/ia/" in request.path %} open{% endif %}>
      <summary class="item-navegacao resumo-grupo-navegacao">
        <span aria-hidden="true">&#10024;</span>
        <span class="sidebar-rotulo">IA</span>
        <span class="seta-submenu sidebar-rotulo" aria-hidden="true">&#9662;</span>
      </summary>
      <div class="submenu-navegacao">
        <a class="item-navegacao{% if request.path == "/ia/configuracao/" %} item-navegacao-ativo{% endif %}" href="/ia/configuracao/"{% if request.path == "/ia/configuracao/" %} aria-current="page"{% endif %}>
          <span class="sidebar-rotulo">Configuracao</span>
        </a>
        <a class="item-navegacao{% if request.path == "/ia/conhecimentos/" %} item-navegacao-ativo{% endif %}" href="/ia/conhecimentos/"{% if request.path == "/ia/conhecimentos/" %} aria-current="page"{% endif %}>
          <span class="sidebar-rotulo">Conhecimento</span>
        </a>
        <a class="item-navegacao{% if request.path == "/ia/perguntas-frequentes/" %} item-navegacao-ativo{% endif %}" href="/ia/perguntas-frequentes/"{% if request.path == "/ia/perguntas-frequentes/" %} aria-current="page"{% endif %}>
          <span class="sidebar-rotulo">Perguntas frequentes</span>
        </a>
      </div>
    </details>
    <a class="item-navegacao{% if "/auditoria/" in request.path %} item-navegacao-ativo{% endif %}" href="/auditoria/historico/"{% if "/auditoria/" in request.path %} aria-current="page"{% endif %}>
      <span aria-hidden="true">&#9716;</span>
      <span class="sidebar-rotulo">Auditoria</span>
    </a>
  </nav>
  <button
    class="botao-icone recolher-sidebar"
    type="button"
    data-recolher-sidebar
    aria-controls="sidebar"
    aria-expanded="true"
  >
    <span aria-hidden="true">&laquo;</span>
    <span class="sidebar-rotulo">Recolher menu</span>
  </button>
</aside>
