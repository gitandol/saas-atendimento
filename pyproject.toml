[project]
name = "saas-atendimento"
version = "0.1.0"
description = "Plataforma SaaS de atendimento por WhatsApp com IA."
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.6,<5.7",
    "cryptography>=45,<46",
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "requests>=2.32,<3",
    "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6,<8",
    "factory-boy>=3.3,<4",
    "import-linter>=2.3,<3",
    "pytest>=8.3,<9",
    "pytest-django>=4.11,<5",
    "responses>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["tarefas", ".superpowers", "docs/superpowers"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP"]
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"apps/*/migrations/*.py" = ["E501"]

[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "Camadas HTTP nao importam models"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "apps.atendimento.api",
    "apps.atendimento.views",
    "apps.ajuda.api",
    "apps.ajuda.views",
    "apps.auditoria.api",
    "apps.auditoria.views",
    "apps.contas.api",
    "apps.contas.views",
    "apps.empresas.api",
    "apps.empresas.views",
    "apps.ia.api",
    "apps.ia.views",
    "apps.nucleo.api",
    "apps.nucleo.views",
    "apps.whatsapp.api",
    "apps.whatsapp.views",
]
forbidden_modules = [
    "apps.atendimento.models",
    "apps.auditoria.models",
    "apps.contas.models",
    "apps.empresas.models",
    "apps.ia.models",
    "apps.nucleo.models",
    "apps.whatsapp.models",
]

[[tool.importlinter.contracts]]
name = "Services nao importam fronteiras HTTP"
type = "forbidden"
source_modules = [
    "apps.atendimento.services",
    "apps.ajuda.services",
    "apps.auditoria.services",
    "apps.contas.services",
    "apps.empresas.services",
    "apps.ia.services",
    "apps.nucleo.services",
    "apps.whatsapp.services",
]
forbidden_modules = [
    "apps.atendimento.api",
    "apps.atendimento.views",
    "apps.ajuda.api",
    "apps.ajuda.views",
    "apps.auditoria.api",
    "apps.auditoria.views",
    "apps.contas.api",
    "apps.contas.views",
    "apps.nucleo.api",
    "apps.nucleo.views",
    "apps.ia.api",
    "apps.ia.views",
    "apps.whatsapp.api",
    "apps.whatsapp.views",
]
